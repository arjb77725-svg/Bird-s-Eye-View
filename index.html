const lessons=[`<p>المثلث شكل مغلق له <strong>٣ أضلاع و٣ رؤوس و٣ زوايا</strong>. نصنّفه بمقارنة أطوال أضلاعه:</p><p>🔺 <strong>متساوي الأضلاع:</strong> ثلاثة أضلاع متساوية، وزواياه كلها ٦٠°.</p><p>🔺 <strong>متساوي الساقين:</strong> ضلعان متساويان فقط في تصنيف درسنا.</p><p>🔺 <strong>مختلف الأضلاع:</strong> أضلاعه وزواياه الثلاث مختلفة.</p><div class="notice">في هذا الدرس نتبع التصنيف المنفصل في الملف المرفق: متساوي الساقين له ضلعان متساويان فقط. وفي تعريف رياضي أوسع يعني «ضلعان على الأقل»، فيشمل متساوي الأضلاع.</div>`,`<p>الساقان هما الضلعان المتساويان، والضلع الثالث هو <strong>القاعدة</strong>. زاوية الرأس بين الساقين وتقابل القاعدة. زاويتا القاعدة عند طرفيها وهما <strong>متساويتان</strong> لأنهما تقابلان ضلعين متساويين.</p><p>💡 يمكن تبرير ذلك برسم منصف زاوية الرأس: يتكون مثلثان متطابقان بضلعين والزاوية المحصورة؛ لذا تتساوى زاويتا القاعدة. المثلثان المتطابقان لهما الشكل والحجم نفسيهما.</p>`,`<p>مجموع زوايا أي مثلث هو <strong>١٨٠°</strong>. في مثلث متساوي الساقين: زاوية الرأس + ٢ × زاوية القاعدة = ١٨٠°.</p><p>مثال: إذا كانت زاوية الرأس ٤٠°، فكل زاوية قاعدة = (١٨٠ − ٤٠) ÷ ٢ = <strong>٧٠°</strong>. وإذا علمنا زاويتين في أي مثلث نطرح مجموعهما من ١٨٠° لإيجاد الثالثة.</p>`,`<p>حان وقت توظيف معرفتك! قارِن الأطوال، ثم استخدم تساوي زاويتي القاعدة ومجموع الزوايا. تذكّر: الضلعان المتساويان تقابلهما زاويتان متساويتان.</p><p>انظر حولك: قد يظهر مثلث متساوي الساقين في سقف منزل متماثل أو في دعامة هندسية.</p>`];

function stageCards(){let a=attempt();return stageTitles.map((t,i)=>`<div class="card stage"><div class="stageImg">${stageIcons[i]}</div><small>المرحلة ${i+1} ${a?.completed.includes(i)?' · ✓ مكتملة':''}</small><h3>${t}</h3><p>${stageDesc[i]}</p><span class="tag">${a?.completed.includes(i)?'اكتملت ✓':i<=(a?.completed.length||0)?'جاهزة للاستكشاف':'🔒 تُفتح لاحقاً'}</span></div>`).join('')}

function diagram(){return `<svg id="tri" viewBox="0 0 340 240" width="340" height="240" aria-label="مثلث متساوي الساقين، أ عند الرأس، ب وج عند القاعدة"><polygon id="poly" points="170,30 50,200 290,200" fill="#d9e9ff" stroke="#4266e9" stroke-width="4"/><line x1="102" y1="109" x2="113" y2="117" stroke="#efac2d" stroke-width="4"/><line x1="227" y1="117" x2="238" y2="109" stroke="#efac2d" stroke-width="4"/><text id="labelA" x="170" y="21" text-anchor="middle" fill="#345" font-size="19">أ</text><text id="labelB" x="35" y="222" fill="#345" font-size="19">ب</text><text id="labelC" x="294" y="222" fill="#345" font-size="19">ج</text><circle id="apex" cx="170" cy="30" r="11" fill="#f5b832" style="cursor:ns-resize"/><circle id="base" cx="290" cy="200" r="11" fill="#36b9b0" style="cursor:ew-resize"/></svg><div class="muted" style="font-size:12px">حرّك النقطة الذهبية أو التركواز باللمس أو الماوس؛ يبقى الساقان متساويين.</div><div class="actions" style="justify-content:center;margin-top:8px"><button class="tiny" onclick="adjustTriangle(-15)">↔ ضيّق القاعدة</button><button class="tiny" onclick="adjustTriangle(15)">وسّع القاعدة ↔</button></div>`}
let triW=120,triY=30;function updateTriangle(){let svg=document.getElementById('tri');if(!svg)return;svg.querySelector('#poly').setAttribute('points',`170,${triY} ${170-triW},200 ${170+triW},200`);svg.querySelector('#apex').setAttribute('cy',triY);svg.querySelector('#base').setAttribute('cx',170+triW);svg.querySelector('#labelA').setAttribute('y',Math.max(18,triY-12));svg.querySelector('#labelB').setAttribute('x',155-triW);svg.querySelector('#labelC').setAttribute('x',174+triW);svg.querySelectorAll('line').forEach(x=>x.style.display=(triW===120&&triY===30)?'':'none')}
function adjustTriangle(d){triW=Math.max(40,Math.min(140,triW+d));updateTriangle()}function setupTriangle(){let svg=document.getElementById('tri');if(!svg)return;svg.querySelectorAll('circle').forEach(el=>{el.onpointerdown=e=>{el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;pt=pt.matrixTransform(svg.getScreenCTM().inverse());if(el.id==='apex')triY=Math.min(165,Math.max(30,pt.y));else triW=Math.min(140,Math.max(40,Math.abs(pt.x-170)));updateTriangle()}})}
function stagePage(){let a=attempt();if(!a){navigate('register');return}let complete=a.completed.includes(stageIndex);app.innerHTML=header(`المرحلة ${stageIndex+1}: ${stageTitles[stageIndex]}`,stageDesc[stageIndex],`<button class="secondary" onclick="navigate('stages')">كل المراحل</button>`)+`<div class="gamegrid"><div class="card box lesson"><span class="pill">🎯 هدف المرحلة</span><h2>${stageTitles[stageIndex]}</h2><p class="muted">${stageDesc[stageIndex]}</p>${lessons[stageIndex]}${stageIndex===1?`<div class="diagram">${diagram()}</div>`:''}<div class="notice">🤖 مرشدك يقول: اقرأ الشرح، واستكشف الرسم، ثم جرّب الأسئلة الثلاثة!</div><button class="primary" onclick="beginQuiz()" ${complete?'disabled':''}>${complete?'أتممت أسئلة هذه المرحلة ✓':'ابدأ أسئلة المرحلة ←'}</button>${complete?` <button class="secondary" onclick="navigate('stages')">متابعة الرحلة</button>`:''}</div><aside class="card side"><h3>خريطة رحلتك 🗺️</h3><p>كل مرحلة تقرّبك من الشهادة</p>${stageTitles.map((t,i)=>`<div class="pathMini"><div class="icon">${a.completed.includes(i)?'✓':stageIcons[i]}</div><div><b>${t}</b><span>${i===stageIndex?'أنت هنا':a.completed.includes(i)?'مكتملة':'المرحلة '+(i+1)}</span></div></div>`).join('')}</aside></div>`;setupTriangle()}
function beginQuiz(){let a=attempt();let pending=a.answers.find(x=>Math.floor(x.id/3)===stageIndex&&!x.correct&&!a.remedies.some(r=>r.id===x.id));if(pending){quiz={idx:pending.id,started:Date.now(),hint:false,feedback:null,remedy:true,selected:null};page='quiz';render();return}let next=Q.slice(stageIndex*3,stageIndex*3+3).findIndex((_,i)=>!a.answers.some(x=>x.id===stageIndex*3+i));if(next<0){finishStage();return}quiz={idx:stageIndex*3+next,started:Date.now(),hint:false,feedback:null,remedy:false,selected:null};page='quiz';render()}
function quizPage(){let a=attempt(),q=Q[quiz.idx],r=q.r,rem=quiz.remedy;let text=rem?r[0]:q.q,opts=rem?r[1]:q.opts;let number=quiz.idx%3+1;let perf=a.answers.length?a.answers.filter(x=>x.correct).length/a.answers.length:0.5;let recent=a.answers.slice(-4),needsSupport=recent.filter(x=>!x.correct).length>=2||recent.filter(x=>x.hint).length>=3;let hintAllowed=needsSupport||a.path==='explorer'||(a.path==='challenger'&&perf<.85)||(a.path==='genius'&&perf<.5);app.innerHTML=header(stageTitles[stageIndex],rem?'تدريب علاجي مختلف لتثبيت المفهوم':`السؤال ${number} من ٣ · ${concepts[q.c]}`,`<span class="pill">⭐ ${a.score} نقطة</span>`)+`<div class="gamegrid"><div class="card box"><div class="progress"><div style="width:${(number-1)/3*100}%"></div></div><h2 class="qtitle">${esc(text)}</h2>${q.diagram&&!rem?`<div class="diagram">${diagram()}</div>`:''}${q.type==='drag'&&!rem?`<div class="diagram"><div style="font-size:48px">🔺</div><div>٤ سم &nbsp; · &nbsp; ٤ سم &nbsp; · &nbsp; ٤ سم</div><p class="muted">اختر بطاقة واسحبها إلى المربع أو اضغط عليها ثم اضغط المربع.</p><div id="drop" class="dropzone" ondragover="event.preventDefault()" ondrop="dropAnswer(event)" onclick="placeAnswer()">ضع النوع هنا</div></div>`:''}<div class="answers">${opts.map((o,i)=>`<button class="choice" draggable="${q.type==='drag'&&!rem}" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="${q.type==='drag'&&!rem?'selectDrag('+i+')':'answer('+i+')'}" ${quiz.feedback?'disabled':''}>${String.fromCharCode(65+i)} &nbsp; ${esc(o)}</button>`).join('')}</div>${!quiz.feedback?`<div class="actions" style="margin-top:16px">${hintAllowed?`<button class="secondary" onclick="showHint()">💡 تلميح</button>`:`<span class="muted" style="font-size:12px">تلميحات أقل تناسب تقدمك؛ عند الصعوبة نعيد توفير المساعدة.</span>`}</div><div id="hint"></div>`:`<div class="feedback ${quiz.feedback.correct?'':'wrong'} sparkle"><b>${quiz.feedback.correct?'✨ أحسنت! إجابة رائعة':'🌱 محاولة جيدة، نتعلم من أخطائنا!'}</b><p>${quiz. function selectDrag(i){quiz.selected=i;document.querySelectorAll('.choice').forEach((x,n)=>x.classList.toggle('selected',n===i));document.getElementById('drop').textContent='اضغط هنا لوضع: '+Q[quiz.idx].opts[i]}function dropAnswer(e){e.preventDefault();let n=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(n))answer(n)}function placeAnswer(){if(quiz.selected!==null)answer(quiz.selected)}

function answer(i){if(quiz.feedback)return;let a=attempt(),q=Q[quiz.idx],correct=i===(quiz.remedy?q.r[2]:q.a),seconds=Math.round((Date.now()-quiz.started)/1000);if(quiz.remedy){a.remedies.push({id:quiz.idx,chosen:i,correct,seconds,hint:quiz.hint});if(correct)a.score+=3}else{a.answers.push({id:quiz.idx,chosen:i,correct,seconds,hint:quiz.hint,at:Date.now()});if(correct)a.score+=10}a.seconds+=seconds;a.activity='أجاب عن سؤال';quiz.feedback={correct};save();sound(correct?'success':'wrong');render()}
function nextQuestion(){let a=attempt();if(!quiz.remedy&&!quiz.feedback.correct){quiz.remedy=true;quiz.feedback=null;quiz.hint=false;quiz.started=Date.now();render();return}let idx=quiz.idx+1;if(idx>=stageIndex*3+3){finishStage();return}quiz={idx,started:Date.now(),hint:false,feedback:null,remedy:false,selected:null};render()}
function finishStage(){let a=attempt();if(a.answers.filter(x=>Math.floor(x.id/3)===stageIndex).length<3){beginQuiz();return}if(!a.completed.includes(stageIndex)){a.completed.push(stageIndex);a.score+=10}a.activity='أكمل المرحلة '+(stageIndex+1);if(a.completed.length===4&&!a.finished){a.finished=Date.now();a.activity='أكمل المغامرة';sound('finish')}else sound('success');save();page='result';render()}
function resultPage(){let a=attempt(),ans=a.answers.filter(x=>Math.floor(x.id/3)===stageIndex),good=ans.filter(x=>x.correct).length;let level=good===3?'ممتاز! أنت مستعد لتحدٍ إضافي.':good===2?'أداء جيد! واصل التدرّج مع الأمثلة.':'أحسنت المحاولة! راجع الشرح وجرّب مرة أخرى عند الحاجة.';app.innerHTML=header('أكملت المرحلة!','كل خطوة تقرّبك من أن تصبح بطلاً هندسياً.')+`<div class="card box" style="text-align:center"><div style="font-size:65px">${stageIcons[stageIndex]}</div><h2>${stageTitles[stageIndex]}</h2><p>${level}</p><div class="badges" style="justify-content:center"><span class="badge">⭐ ${good} / ٣ إجابات صحيحة</span><span class="badge">🎁 مكافأة المرحلة: ١٠ نقاط</span><span class="badge">🏅 ${['مستكشف المثلثات','بطل الأضلاع','خبير الزوايا','العبقري الهندسي'][stageIndex]}</span></div>${good===3&&!a.bonus.includes(stageIndex)?`<div class="notice">تحدٍّ استنتاجي إضافي اختياري: ${['هل زوايا المثلث مختلف الأضلاع الثلاث مختلفة؟','هل زاوية الرأس تقابل القاعدة؟','إذا كانت زاوية الرأس ٦٠° في مثلث متساوي الساقين، فهل زاويتا القاعدة كل منهما ٦٠°؟','هل يمكن أن يكون مثلث زواياه ٥٠°، ٥٠°، ٨٠° متساوي الساقين؟'][stageIndex]} <button class="tiny" onclick="bonus(true)">نعم</button> <button class="tiny" onclick="bonus(false)">لا</button></div>`:''}<div class="actions" style="justify-content:center;margin-top:22px">${stageIndex<3?`<button class="primary" onclick="openStage(${stageIndex+1})">المرحلة التالية ←</button>`:`<button class="primary" onclick="navigate('certificate')">عرض شهادة الإنجاز 📜</button>`}<button class="secondary" onclick="navigate('stages')">خريطة المراحل</button></div></div>`}

function settings(){let s=db.settings;document.getElementById('modal').innerHTML=`<div class="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="card box modal"><div class="pageHead"><h2>إعدادات العرض ⚙️</h2><button class="secondary" onclick="closeModal()">✕</button></div><label><b>المظهر</b></label><div class="actions" style="margin:10px 0 20px"><button class="${!s.night?'primary':'secondary'}" onclick="setNight(false)">☀️ نهاري</button><button class="${s.night?'primary':'secondary'}" onclick="setNight(true)">🌙 ليلي</button></div><b>لون الواجهة</b><div class="colors" style="margin:12px 0">${['#335ce8','#008f89','#25805c','#7547c7','#ba467a','#a97700'].map((c,i)=>`<button class="swatch" style="background:${c}" aria-label="${['أزرق','تركواز','أخضر','بنفسجي','وردي','ذهبي'][i]}" onclick="setColor('${c}')"></button>`).join('')}<input aria-label="لون مخصص" type="color" value="${esc(s.color)}" oninput="setColor(this.value,false)" style="width:45px;padding:2px;min-height:39px;height:39px"></div><p class="muted" style="font-size:12px">الألوان المختارة شديدة الفتح تُضبط تلقائياً لتبقى الأزرار واضحة.</p><label><input type="checkbox" style="width:auto;min-height:0" ${s.mute?'checked':''} onchange="db.settings.mute=this.checked;save()"> كتم الأصوات</label><p><label for="volume">مستوى الصوت</label><input id="volume" type="range" min="0" max="1" step="0.05" value="${s.volume}" oninput="db.settings.volume=Number(this.value);save()"></p><button class="primary" onclick="closeModal()">تم</button></div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}function setNight(v){db.settings.night=v;save();applyTheme();settings()}function setColor(v,redraw=true){let r=parseInt(v.slice(1,3),16),g=parseInt(v.slice(3,5),16),b=parseInt(v.slice(5,7),16);while((.2126*r+.7152*g+.0722*b)>125){r=Math.round(r*.9);g=Math.round(g*.9);b=Math.round(b*.9)}db.settings.color='#'+[r,g,b].map(n=>n.toString(16).padStart(2,'0')).join('');save();applyTheme();if(redraw)settings()}
async function hashPin(pin){let data=new TextEncoder().encode('golden-triangle-local:'+pin);let h=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(h),x=>x.toString(16).padStart(2,'0')).join('')}
function teacherLogin(target){document.getElementById('modal').innerHTML=`<div class="modalBackdrop"><div class="card box modal"><div class="pageHead"><h2>🔐 دخول المعلم</h2><button class="secondary" onclick="closeModal()">✕</button></div><p>${db.teacher?'أدخل رمز المعلم المحلي.':'أنشئ رمزاً للمعلم على هذا المتصفح (٤ أحرف على الأقل).'}</p><div class="notice">تنبيه: الرمز حاجز واجهة محلي فقط، وليس حماية أمنية للبيانات. يستطيع من يصل إلى الجهاز أو أدوات المتصفح قراءة البيانات. لا تستخدمه لحماية معلومات حساسة.</div><input id="pin" type="password" placeholder="رمز المعلم" autocomplete="off"><p id="pinError" class="error"></p><button class="primary" onclick="submitPin('${target}')">${db.teacher?'دخول':'إنشاء الرمز والدخول'}</button></div></div>`;document.getElementById('pin').focus()}
async function submitPin(target){let p=document.getElementById('pin').value;if(p.length<4){document.getElementById('pinError').textContent='يجب أن يتكون الرمز من ٤ أحرف على الأقل.';return}try{let h=await hashPin(p);if(db.teacher&&h!==db.teacher){document.getElementById('pinError').textContent='الرمز غير صحيح.';return}if(!db.teacher){db.teacher=h;save()}teacherUnlocked=true;closeModal();navigate(target)}catch(e){document.getElementById('pinError').textContent='تعذّر تشغيل التحقق من الرمز في هذا المتصفح.'}}
function leaderboard(){let list=db.students.map(s=>({s,a:best(s)})).filter(x=>x.a);app.innerHTML=header('لوحة المتصدرين','تقدّم حقيقي، وإنجازات تستحق الاحتفال 🏅')+(!db.share&&!teacherUnlocked?`<div class="card box"><h3>🔒 لوحة المتصدرين خاصة</h3><p>لا تظهر أسماء الطلاب ونتائجهم إلا بعد موافقة المعلم من لوحة التحكم. يمكنك رؤية نتيجتك الشخصية فقط.</p>${student()?`<div class="notice">${avatar(student())} ${esc(student().name)} · ${best(student()).score} نقطة · ${pct(best(student()))}٪</div>`:''}</div>`:`<div class="card box"><div class="formgrid noPrint"><div class="field"><label>ابحث عن اسم</label><input id="search" placeholder="اسم الطالب" oninput="filterBoard()"></div><div class="field"><label>الفصل</label><select id="classFilter" onchange="filterBoard()"><option value="">كل الفصول</option>${[...new Set(list.map(x=>x.s.class))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>ترتيب العرض</label><select id="sortBoard" onchange="filterBoard()"><option value="score">أفضل نتيجة</option><option value="recent">آخر من أكملوا</option></select></div></div><div id="boardTable"></div></div>`);if(db.share||teacherUnlocked)filterBoard()}
function filterBoard(){let search=document.getElementById('search').value.trim(),cl=document.getElementById('classFilter').value,sort=document.getElementById('sortBoard').value;let rows=db.students.map(s=>({s,a:best(s)})).filter(x=>x.a&&x.s.name.includes(search)&&(!cl||x.s.class===cl));if(sort==='recent')rows=rows.filter(x=>x.s.attempts.some(a=>a.finished)).map(x=>({s:x.s,a:x.s.attempts.filter(a=>a.finished).sort((a,b)=>b.finished-a.finished)[0]})).sort((a,b)=>b.a.finished-a.a.finished);else rows.sort((a,b)=>b.a.score-a.a.score||pct(b.a)-pct(a.a)||a.a.started-b.a.started);document.getElementById('boardTable').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>الترتيب</th><th>الطالب</th><th>الفصل</th><th>النقاط</th><th>الصحة</th><th>الصحيحة</th><th>المراحل</th></tr></thead><tbody>${rows.map(({s,a},i)=>`<tr><td>${sort==='score'?['🥇','🥈','🥉'][i]||i+1:'—'}</td><td>${avatar(s)} ${esc(s.name)}</td><td>${esc(s.class)}</td><td>${a.score}</td><td>${pct(a)}٪</td><td>${a.answers.filter(x=>x.correct).length} / ١٢</td><td>${done(a)} / ٤</td></tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:11px">${sort==='score'?'الترتيب بالنقاط ثم نسبة الإجابات الصحيحة، ثم الأسبق في بدء المحاولة عند التعادل. تعرض أفضل محاولة لكل طالب.':'يعرض آخر محاولة مكتملة لكل طالب.'}</p>`:'<p class="muted">لا توجد نتائج مطابقة بعد.</p>'}
function allAttempts(){return db.students.flatMap(s=>s.attempts.map(a=>({s,a})))}function avg(arr){return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0}function accuracy(a){return a.answers.length?Math.round(a.answers.filter(x=>x.correct).length/a.answers.length*100):0}function bars(a){return concepts.map((c,i)=>{let xs=a.answers.filter(x=>Q[x.id].c===i),v=xs.length?Math.round(xs.filter(x=>x.correct).length/xs.length*100):null;return `<div class="barItem"><div style="display:flex;justify-content:space-between"><span>${c}</span><b>${v===null?'لم يُقَيّم':v+'٪ · '+mastery(v)}</b></div><div class="progress"><div style="width:${v||0}%"></div></div></div>`}).join('')}function mastery(v){return v>=85?'متقن':v>=65?'جيد':v>=40?'يحتاج إلى مراجعة':'يحتاج إلى دعم إضافي'}
function dashboard(){let all=allAttempts(),latest=db.students.map(s=>({s,a:attempt(s)})).filter(x=>x.a),completed=latest.filter(x=>x.a.finished).length,acc=all.flatMap(x=>x.a.answers),avgAcc=acc.length?Math.round(acc.filter(x=>x.correct).length/acc.length*100):0;let top=[...latest].map(x=>({s:x.s,a:best(x.s)})).sort((x,y)=>y.a.score-x.a.score||pct(y.a)-pct(x.a)).slice(0,5);let measures=[['إجمالي الطلاب',db.students.length,'👥'],['أكملوا الرحلة',completed,'🎓'],['لم يكملوا',latest.length-completed,'⏳'],['متوسط النقاط',avg(latest.map(x=>x.a.score)),'⭐'],['أعلى درجة',latest.length?Math.max(...latest.map(x=>x.a.score)):0,'🏆'],['أقل درجة',latest.length?Math.min(...latest.map(x=>x.a.score)):0,'📉'],['متوسط الصحة',avgAcc+'٪','✅'],['متوسط الخطأ',(acc.length?100-avgAcc:0)+'٪','📝'],['إجمالي المحاولات',all.length,'🔄']];let stages=stageTitles.map((t,i)=>{let ar=acc.filter(x=>Math.floor(x.id/3)===i);return {t,v:ar.length?Math.round(ar.filter(x=>x.correct).length/ar.length*100):null}});let conceptStats=concepts.map((c,i)=>{let ar=acc.filter(x=>Q[x.id].c===i);return {c,i,n:ar.length,w:ar.filter(x=>!x.correct).length}}).filter(x=>x.n).sort((a,b)=>b.w/b.n-a.w/a.n);let hardest=Q.map((q,i)=>{let ar=acc.filter(x=>x.id===i);return {i,n:ar.length,w:ar.filter(x=>!x.correct).length}}).filter(x=>x.n).sort((a,b)=>b.w/b.n-a.w/a.n);let support=latest.filter(({a})=>a.answers.length&&accuracy(a)<65);app.innerHTML=header('لوحة المعلم','نظرة واضحة على رحلة التعلّم في هذا المتصفح.',`<button class="secondary noPrint" onclick="teacherUnlocked=false;navigate('home')">تسجيل الخروج</button>`)+`<div class="notice">🔒 بيانات هذا الجهاز والمتصفح فقط، وليست بيانات الفصل عبر الأجهزة. الأرقام مبنية على الإجابات المسجّلة ولا تثبت سبب الخطأ.</div><div class="statsRow" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${measures.map(m=>`<div class="card stat"><div class="icon">${m[2]}</div><div><b>${m[1]}</b><span>${m[0]}</span></div></div>`).join('')}</div><div class="grid2" style="margin-top:20px"><div class="card box"><h3>📊 أداء المراحل</h3>${stages.map(x=>`<div class="barItem"><div style="display:flex;justify-content:space-between"><span>${x.t}</span><b>${x.v===null?'لا بيانات':x.v+'٪'}</b></div><div class="progress"><div style="width:${x.v||0}%"></div></div></div>`).join('')}<p class="muted" style="font-size:11px">النسب من الإجابات الأساسية المسجلة، بما فيها المحاولات المتعددة.</p></div><div class="card box"><h3>🏆 أفضل خمسة طلاب</h3>${top.length?top.map((x,i)=>`<div class="pathMini"><div class="icon">${['🥇','🥈','🥉','4','5'][i]}</div><div style="flex:1"><b>${avatar(x.s)} ${esc(x.s.name)}</b><span>${esc(x.s.class)} · ${pct(x.a)}٪</span></div><b>${x.a.score}</b></div>`).join(''):'<p class="muted">لا توجد نتائج بعد.</p>'}</div><div class="card box"><h3>💡 تحليل وتوصيات</h3>${hardest.length?`<p><b>الأكثر صعوبة:</b> ${esc(Q[hardest[0].i].q)} (${hardest[0].w}/${hardest[0].n} خطأ)</p><p><b>الأكثر سهولة:</b> ${esc(Q[hardest[hardest.length-1].i].q)} (${hardest[hardest.length-1].w}/${hardest[hardest.length-1].n} خطأ)</p><p><b>المفهوم الأكثر حاجة للمراجعة:</b> ${conceptStats[0].c}</p><div class="notice">يوصى بمراجعة ${conceptStats[0].c} باستخدام رسم توضيحي ونشاط تطبيقي. الاستنتاج احتمالي ويتأثر بحجم البيانات.</div>${classInsights(acc,stages)}`:'<p class="muted">ستظهر التوصيات عند تسجيل الإجابات.</p>'}</div><div class="card box"><h3>🌱 طلاب يحتاجون إلى دعم</h3>${support.length?support.map(x=>`<div class="pathMini"><div class="icon">${avatar(x.s)}</div><div><b>${esc(x.s.name)} · ${esc(x.s.class)}</b><span>${accuracy(x.a)}٪ من الإجابات المجابة صحيحة</span></div><button class="tiny" onclick="showStudent('${x.s.id}')">عرض</button></div>`).join(''):'<p class="muted">لا توجد بيانات تستدعي الدعم حالياً.</p>'}<h3>🕒 النشاط الأخير</h3>${[...latest].sort((x,y)=>(y.a.finished||y.a.answers.at(-1)?.at||y.a.started)-(x.a.finished||x.a.answers.at(-1)?.at||x.a.started)).slice(0,5).map(x=>`<p style="font-size:12px">${avatar(x.s)} ${esc(x.s.name)} · ${esc(x.a.activity)} · ${date(x.a.finished||x.a.answers.at(-1)?.at||x.a.started)}</p>`).join('')||'<p class="muted">لا نشاط بعد.</p>'}</div></div><div class="card box noPrint" style="margin-top:20px"><h3>إعدادات الخصوصية والتقارير</h3><label><input type="checkbox" style="width:auto;min-height:0" ${db.share?'checked':''} onchange="db.share=this.checked;save()"> أوافق على عرض أسماء الطلاب الأولى ونتائجهم في لوحة المتصدرين على هذا الجهاز</label><div class="actions" style="margin-top:16px"><button class="primary" onclick="navigate('analytics')">تحليل المتعلمين</button><button class="secondary" onclick="exportCSV()">⬇ تصدير CSV</button><button class="secondary" onclick="navigate('report')">📄 تقرير الفصل للطباعة أو PDF</button></div></div>`}
function classInsights(acc,stages){let assessed=stages.filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);let wrong={};acc.filter(x=>!x.correct).forEach(x=>{let k=Q[x.id].opts[x.chosen];wrong[k]=(wrong[k]||0)+1});let frequent=Object.entries(wrong).sort((a,b)=>b[1]-a[1])[0];let rates=concepts.map((c,i)=>{let students=db.students.map(s=>attempt(s)).filter(Boolean).map(a=>a.answers.filter(x=>Q[x.id].c===i)).filter(x=>x.length);let n=students.filter(x=>x.filter(y=>y.correct).length/x.length>=.85).length;return `${c}: ${students.length?Math.round(n/students.length*100)+'٪':'لا بيانات'}`});return `<p><b>أفضل مرحلة:</b> ${assessed[0]?.t||'لا بيانات'} · <b>تحتاج مراجعة:</b> ${assessed.at(-1)?.t||'لا بيانات'}</p><p><b>أكثر إجابة خاطئة تكراراً:</b> ${frequent?esc(frequent[0])+' ('+frequent[1]+')':'لا توجد'}</p><p style="font-size:12px"><b>نسبة المتقنين من الطلاب الذين أجيبوا على المفهوم:</b> ${rates.join(' · ')}</p>`}

ncepts[q.c]} برسم ثم قدّم مثالاً مختلفاً.</div>`}).join(''):'<p class="muted">لا توجد أخطاء مسجلة في المحاولة الأخيرة.</p>'}</div><div class="actions noPrint" style="margin-top:20px"><button class="secondary" onclick="navigate('analytics')">عودة للتحليلات</button><button class="secondary" onclick="exportCSV()">تصدير النتائج CSV</button></div>`}
